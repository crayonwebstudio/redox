server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Old .html URLs redirect to the clean canonical URL.
    # These run before location handling. The nested index rule must come
    # first so /about/index.html becomes /about/, not /about/index/.
    rewrite ^/(.*)/index\.html$ /$1/ permanent;
    rewrite ^/index\.html$ / permanent;
    rewrite ^/([^/]+)\.html$ /$1/ permanent;

    location / {
        # Proven pattern used by the other Astro sites on this server.
        # Do NOT add $uri/index.html here: it made nginx redirect
        # /about/ to /about/index/ (and / to /index/), which then 404d.
        # $uri/ plus the index directive above serves directory index files.
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
