server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Old single-segment .html URLs redirect to the clean canonical URL,
    # for example /about.html -> /about/.
    #
    # This MUST stay a regex location, not a server-level rewrite, and it
    # MUST exclude index.html. Reason, learned the hard way on this site:
    # nginx resolves a directory request (/about/) by internally redirecting
    # to its index file (/about/index.html). A server-level .html rewrite
    # intercepts that internal redirect and sends the visitor to
    # /about/index/ (first attempt) or back to /about/ (second attempt,
    # a redirect loop). The regex below cannot match /about/index.html
    # (the [^/]+ group cannot cross the slash) and cannot match /index.html
    # (the negative lookahead), so directory index handling is untouched.
    location ~ ^/(?!index\.html)([^/]+)\.html$ {
        return 301 /$1/;
    }

    location / {
        # Proven pattern used by the other Astro sites on this server.
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
